<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Угадайте советский фильм по фразе — тест 36ON</title><style>
#on36quiz{font-family:Arial,Helvetica,sans-serif;max-width:720px;margin:24px auto;color:#202124;background:#fff;border:1px solid #e8e8e8;border-radius:18px;overflow:hidden;box-shadow:0 6px 30px #0000000a}#on36quiz *{box-sizing:border-box}#on36quiz .top{padding:24px 26px;background:#171717;color:white}#on36quiz .brand{color:#ff8548;font-weight:900;letter-spacing:2px;font-size:16px}#on36quiz h2{font-size:clamp(23px,4vw,34px);line-height:1.17;margin:13px 0}#on36quiz .sub{color:#ddd;line-height:1.5;font-size:15px}#on36quiz .main{padding:25px}#on36quiz .meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#777;margin-bottom:12px}#on36quiz .track{height:7px;background:#eee;border-radius:20px;overflow:hidden}#on36quiz .fill{height:100%;background:#f47737;transition:width .25s}#on36quiz .quote{font-size:clamp(22px,4vw,30px);font-weight:800;line-height:1.3;margin:27px 0}#on36quiz .opts{display:grid;gap:10px}#on36quiz .option{width:100%;text-align:left;background:#fafafa;border:1px solid #ddd;border-radius:12px;padding:15px 17px;font-size:16px;cursor:pointer;color:#222;line-height:1.35}#on36quiz .option:hover:not(:disabled){border-color:#f47737;background:#fff5ed}#on36quiz .option:focus-visible,#on36quiz button:focus-visible{outline:3px solid #f47737;outline-offset:2px}#on36quiz .option:disabled{cursor:default}#on36quiz .option.good{border-color:#259f6c;background:#e9f8f0}#on36quiz .option.bad{border-color:#dc5555;background:#fff0f0}#on36quiz .feedback{min-height:42px;font-size:15px;line-height:1.5;margin-top:17px}#on36quiz .next,#on36quiz .start,#on36quiz .share{border:0;border-radius:12px;padding:14px 20px;background:#f47737;color:white;font-size:16px;font-weight:bold;cursor:pointer;margin-top:12px}#on36quiz .next:disabled{opacity:.4;cursor:default}#on36quiz .share{background:#202124}#on36quiz .center{text-align:center}#on36quiz .score{font-size:55px;font-weight:900;color:#f47737;margin:18px 0 0}#on36quiz .small{font-size:13px;color:#777;line-height:1.5}#on36quiz .hidden{display:none}#on36quiz .footer{border-top:1px solid #eee;padding:15px 25px;font-size:12px;color:#777}
</style></head><body><section id="on36quiz" aria-label="Тест о советском кино"><div class="top"><div class="brand">36ON · КИНОТЕСТ</div><h2>Угадайте советский фильм по одной фразе</h2><div class="sub">15 легендарных реплик. Сможете вспомнить все фильмы без подсказок?</div></div><div class="main"><div id="on36intro" class="center"><p>Начнём с простого, а дальше будет сложнее. Выберите один из четырёх ответов.</p><button class="start" id="on36start">Начать тест →</button></div><div id="on36game" class="hidden"><div class="meta"><span id="on36counter"></span><span id="on36points"></span></div><div class="track"><div class="fill" id="on36fill"></div></div><div class="quote" id="on36quote"></div><div class="opts" id="on36opts"></div><div class="feedback" id="on36feedback" aria-live="polite"></div><button class="next hidden" id="on36next">Следующий вопрос →</button></div><div id="on36result" class="center hidden"><div class="score" id="on36score"></div><h2 id="on36rank"></h2><p id="on36desc"></p><button class="start" id="on36again">Пройти ещё раз</button> <button class="share" id="on36share">Поделиться результатом</button><p class="small" id="on36sharemsg"></p></div></div><div class="footer">36ON — народное СМИ о Воронеже · Развлекательный тест</div></section><script>
(function(){'use strict';const root=document.getElementById('on36quiz');if(!root||root.dataset.ready)return;root.dataset.ready='1';const $=id=>root.querySelector('#'+id);const data=[
['Какая гадость эта ваша заливная рыба!',['Ирония судьбы, или С лёгким паром!','Служебный роман','Карнавальная ночь','Чародеи'],0],
['Огласите весь список, пожалуйста!',['Бриллиантовая рука','Иван Васильевич меняет профессию','Операция «Ы»','Джентльмены удачи'],1],
['Наши люди в булочную на такси не ездят!',['Афоня','Любовь и голуби','Бриллиантовая рука','Москва слезам не верит'],2],
['Людк, а Людк!',['Любовь и голуби','Девчата','Москва слезам не верит','Самая обаятельная и привлекательная'],0],
['Будем искать!',['Джентльмены удачи','Бриллиантовая рука','Кавказская пленница','Берегись автомобиля'],1],
['Восток — дело тонкое!',['Белое солнце пустыни','Неуловимые мстители','Кин-дза-дза!','Свой среди чужих, чужой среди своих'],0],
['А вас, Штирлиц, я попрошу остаться.',['Место встречи изменить нельзя','Семнадцать мгновений весны','ТАСС уполномочен заявить…','Щит и меч'],1],
['Птичку жалко!',['Бриллиантовая рука','Кавказская пленница','Операция «Ы»','Джентльмены удачи'],1],
['Утром деньги — вечером стулья.',['Золотой телёнок','Двенадцать стульев','Не может быть!','Свадьба в Малиновке'],1],
['Какая же ты противная, Шарапов!',['Место встречи изменить нельзя','Ликвидация','Следствие ведут ЗнаТоКи','Государственная граница'],0],
['Муля, не нервируй меня!',['Подкидыш','Весёлые ребята','Цирк','Волга-Волга'],0],
['Я требую продолжения банкета!',['Иван Васильевич меняет профессию','Не может быть!','Операция «Ы»','Карнавальная ночь'],0],
['Танцуют все!',['Кавказская пленница','Иван Васильевич меняет профессию','Афоня','Мимино'],1],
['Ну, граждане алкоголики, хулиганы, тунеядцы…',['Операция «Ы» и другие приключения Шурика','Джентльмены удачи','Кавказская пленница','Бриллиантовая рука'],0],
['Пилите, Шура, пилите!',['Двенадцать стульев','Золотой телёнок','Берегись автомобиля','Не может быть!'],1]
];let i=0,score=0,locked=false;function show(id){['on36intro','on36game','on36result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function render(){locked=false;const q=data[i];$('on36counter').textContent='Вопрос '+(i+1)+' из '+data.length;$('on36points').textContent='Верно: '+score;$('on36fill').style.width=((i)/data.length*100)+'%';$('on36quote').textContent='«'+q[0]+'»';$('on36feedback').textContent='';$('on36next').classList.add('hidden');const opts=$('on36opts');opts.replaceChildren();q[1].forEach((name,n)=>{const b=document.createElement('button');b.className='option';b.type='button';b.textContent=String.fromCharCode(1040+n)+'. '+name;b.addEventListener('click',()=>choose(n));opts.appendChild(b)})}function choose(n){if(locked)return;locked=true;const q=data[i],correct=n===q[2];if(correct)score++;const buttons=[...$('on36opts').children];buttons.forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('good');else if(k===n)b.classList.add('bad')});$('on36feedback').textContent=correct?'Верно! Вы узнали фильм.':'Не угадали. Правильный ответ: '+q[1][q[2]]+'.';$('on36points').textContent='Верно: '+score;$('on36next').textContent=i===data.length-1?'Узнать результат →':'Следующий вопрос →';$('on36next').classList.remove('hidden');$('on36fill').style.width=((i+1)/data.length*100)+'%'}function finish(){show('on36result');$('on36score').textContent=score+' / '+data.length;const rank=score===15?'Легенда советского кино':score>=12?'Настоящий киноман':score>=8?'Любитель классики':'Есть что пересмотреть!';$('on36rank').textContent=rank;$('on36desc').textContent='Вы узнали '+score+' из 15 фильмов. Отправьте тест друзьям и сравните результаты!'}$('on36start').addEventListener('click',()=>{show('on36game');render()});$('on36next').addEventListener('click',()=>{if(i<data.length-1){i++;render()}else finish()});$('on36again').addEventListener('click',()=>{i=0;score=0;show('on36game');render()});$('on36share').addEventListener('click',async()=>{const message='Я угадал(а) '+score+' из 15 советских фильмов в тесте 36ON! А ты? '+location.href;try{if(navigator.share){await navigator.share({title:'Тест 36ON: советское кино',text:message,url:location.href})}else if(navigator.clipboard){await navigator.clipboard.writeText(message);$('on36sharemsg').textContent='Результат и ссылка скопированы'}else{$('on36sharemsg').textContent=message}}catch(e){if(e.name!=='AbortError')$('on36sharemsg').textContent=message}})})();
</script></body></html>
